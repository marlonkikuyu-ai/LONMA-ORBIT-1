<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LONMA ORBIT - Categories</title>
<style>
:root{--bg:#070e1e;--c:#121d33;--l:#1f2d4d;--b:#2f81ff;--g:#00e676;--t:#dbeafe;--m:#8aa0c8}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:var(--bg);color:var(--t)}
.top{height:60px;background:var(--c);border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}
.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:16px}
.tabbar{padding:0 14px;display:flex;gap:8px;overflow:auto}
.tab{padding:10px 16px;background:var(--c);border:1px solid var(--l);border-radius:99px;cursor:pointer;font-size:13px}
.tab.on{background:var(--b);color:#fff;font-weight:800}
.view{padding:14px}
table{width:100%;border-collapse:collapse;background:var(--c);border:1px solid var(--l);border-radius:16px;overflow:hidden;margin-bottom:12px}
th,td{padding:12px;border-bottom:1px solid var(--l);font-size:13px}th{color:var(--m);font-size:10px;text-transform:uppercase}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--l);background:var(--bg);color:#fff;margin-bottom:8px}
.btn{padding:12px;border-radius:10px;border:0;background:var(--b);color:#fff;font-weight:800;cursor:pointer;width:100%}
.btn-g{background:var(--g);color:#000}
.cat{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;background:#1e293b;color:#93c5fd}
.grid2{display:grid;grid-template-columns:1fr 360px;gap:12px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 12px;background:var(--c);border:1px solid var(--l);border-radius:99px;font-size:12px;cursor:pointer}
.chip.on{background:var(--b);border-color:var(--b)}
</style>
</head>
<body>
<div class="top"><div><b>LONMA ORBIT</b> <small style="color:var(--m)">• Categories OS</small></div><div style="color:#5ee9b5;font-size:12px">● LIVE</div></div>

<div class="stats">
<div class="card"><small>ORDERS</small><h2 id="k1">-</h2></div>
<div class="card"><small>PRODUCTS</small><h2 id="k2">-</h2></div>
<div class="card"><small>CATEGORIES</small><h2 id="k3">-</h2></div>
<div class="card"><small>SUPERMARKETS</small><h2 id="k4">-</h2></div>
</div>

<div class="tabbar">
<div class="tab on" onclick="show('orders',this)">📦 Orders</div>
<div class="tab" onclick="show('super',this)">🛒 Supermarkets + Categories</div>
<div class="tab" onclick="show('pay',this)">💳 M-Pesa</div>
</div>

<div class="view" id="v"></div>

<script>
let cats=["Bakery","Dairy","Drinks","Fruits","Vegetables","Meat","Household","Snacks","Flour & Grains"];
let supers=JSON.parse(localStorage.getItem('lo_super')||'["Naivas Thika","Quickmart Kiganjo","Carrefour Thika"]');
let products=JSON.parse(localStorage.getItem('lo_prods')||'[{"name":"Fresh Milk 500ml","price":120,"stock":50,"cat":"Dairy","super":"Naivas Thika"},{"name":"White Bread","price":70,"stock":100,"cat":"Bakery","super":"Quickmart Kiganjo"},{"name":"Coca-Cola 1L","price":120,"stock":80,"cat":"Drinks","super":"Carrefour Thika"}]');
function save(){localStorage.setItem('lo_super',JSON.stringify(supers));localStorage.setItem('lo_prods',JSON.stringify(products))}
let curCat='All';

async function api(u){try{let r=await fetch(u);return await r.json()}catch{return {orders:[]}}}

async function show(t,el){
if(el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on')}
let v=document.getElementById('v');
if(t=='orders'){
 let d=await api('/orders');
 v.innerHTML=`<table><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr>${d.orders.map(o=>`<tr><td>${o.id}</td><td>${o.customer}</td><td>KES ${o.total}</td><td>${o.status}</td></tr>`).join('')}</table>`;
}else{
 let filterProds=curCat=='All'?products:products.filter(p=>p.cat==curCat);
 v.innerHTML=`<div class="grid2">
 <div>
 <div class="chips"><div class="chip ${curCat=='All'?'on':''}" onclick="curCat='All';show('super',null)">All</div>${cats.map(c=>`<div class="chip ${curCat==c?'on':''}" onclick="curCat='${c}';show('super',null)">${c}</div>`).join('')}</div>
 <table><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Super</th><th></th></tr>
 ${filterProds.map((p,i)=>`<tr><td><b>${p.name}</b></td><td><span class="cat">${p.cat}</span></td><td>KES ${p.price}</td><td>${p.stock}</td><td>${p.super}</td><td><button onclick="delP(${products.indexOf(p)})" style="background:#ef4444;border:0;padding:5px 8px;border-radius:6px;color:#fff">X</button></td></tr>`).join('')||'<tr><td colspan=6 style="color:var(--m)">No products in this category</td></tr>'}
 </table>
 <table><tr><th>Supermarkets</th><th>Items</th></tr>${supers.map(s=>`<tr><td>${s}</td><td>${products.filter(p=>p.super==s).length} products</td></tr>`).join('')}</table>
 </div>
 <div>
 <div class="card"><b>Add Category</b><br><br><input id="newCat" placeholder="e.g Frozen Foods"><button class="btn" onclick="addCat()">+ Add Category</button></div>
 <div class="card" style="margin-top:10px"><b>Add Supermarket</b><br><br><input id="newSuper" placeholder="e.g Naivas Mountain Mall"><button class="btn" onclick="addSuper()">+ Add Supermarket</button></div>
 <div class="card" style="margin-top:10px"><b>Add Product</b><br><br>
 <input id="pName" placeholder="Product Name">
 <input id="pPrice" type="number" placeholder="Price KES">
 <input id="pStock" type="number" placeholder="Stock">
 <select id="pCat">${cats.map(c=>`<option>${c}</option>`).join('')}</select>
 <select id="pSuper">${supers.map(s=>`<option>${s}</option>`).join('')}</select>
 <button class="btn btn-g" onclick="addProd()">+ Add Product</button>
 </div>
 </div>
 </div>`;
}
}

function addCat(){let v=document.getElementById('newCat').value.trim();if(!v)return;if(!cats.includes(v))cats.push(v);show('super',document.querySelectorAll('.tab')[1])}
function addSuper(){let v=document.getElementById('newSuper').value.trim();if(!v)return;supers.push(v);save();show('super',document.querySelectorAll('.tab')[1])}
function addProd(){
 let n=document.getElementById('pName').value,p=document.getElementById('pPrice').value,s=document.getElementById('pStock').value,c=document.getElementById('pCat').value,su=document.getElementById('pSuper').value;
 if(!n||!p)return alert('Name & price needed');
 products.push({name:n,price:parseInt(p),stock:parseInt(s)||0,cat:c,super:su});save();show('super',document.querySelectorAll('.tab')[1]);
}
function delP(i){products.splice(i,1);save();show('super',document.querySelectorAll('.tab')[1])}

(async()=>{
 let o=await api('/orders');
 document.getElementById('k1').innerText=o.orders.length;
 document.getElementById('k2').innerText=products.length;
 document.getElementById('k3').innerText=cats.length;
 document.getElementById('k4').innerText=supers.length;
 show('orders',document.querySelector('.tab'));
})();
</script>
</body>
</html>
