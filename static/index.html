<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lonma Orbit</title>
<style>
body{font-family:sans-serif;background:#f6f7fb;margin:0;padding:0}
.top{max-width:1100px;margin:0 auto;padding:40px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:22px}
.btn{background:black;color:white;padding:10px 18px;border-radius:10px;text-decoration:none}
.hero{max-width:1100px;margin:0 auto;padding:80px 20px;text-align:center}
.hero h1{font-size:48px;line-height:1.1;margin:0}
.hero p{color:#666;font-size:18px;margin-top:16px}
.card{max-width:500px;margin:40px auto;background:white;padding:28px;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,0.08)}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #ddd;margin:8px 0;box-sizing:border-box}
button{width:100%;padding:14px;border-radius:10px;border:none;background:black;color:white;font-weight:600;margin-top:10px;cursor:pointer}
.status{margin-top:14px;font-size:14px}
</style>
</head>
<body>
<div class="top">
<div class="logo">LONMA ORBIT</div>
<a class="btn" href="/docs">API Docs</a>
</div>
<div class="hero">
<h1>Fast Delivery, Smart Orbit.</h1>
<p>Your backend is live at app.lonmaorbit.co.ke</p>
<div class="card">
<input id="email" placeholder="Enter email">
<input id="pass" type="password" placeholder="Enter password">
<button onclick="check()">Check API Connection</button>
<div id="out" class="status"></div>
</div>
</div>
<script>
async function check(){
 const o=document.getElementById('out');
 o.innerText='Connecting...';
 try{
  const r=await fetch('/docs');
  if(r.ok) o.innerText='✅ Backend Connected - '+location.origin;
  else o.innerText='Connected with status '+r.status;
 }catch(e){o.innerText='❌ '+e}
}
</script>
</body>
</html>
