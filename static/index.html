<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LONMA ORBIT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0f172a;color:#fff}
.header{background:#1e293b;padding:16px 24px;display:flex;align-items:center;gap:12px}
.header img{width:42px;height:42px;border-radius:10px;background:#fff}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:24px}
.card{background:#1e293b;padding:20px;border-radius:16px}
.tabs{display:flex;gap:8px;padding:0 24px}
.tab{padding:10px 18px;background:#1e293b;border-radius:10px;cursor:pointer}
.tab.active{background:#3b82f6}
.section{padding:24px}
table{width:100%;background:#1e293b;border-radius:16px;border-collapse:collapse;overflow:hidden}
th,td{padding:14px;text-align:left;border-bottom:1px solid #334155}
input,button{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;margin-bottom:10px}
button{background:#22c55e;color:#000;font-weight:800;border:0;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<img src="/static/logo.png">
<div><b>LONMA ORBIT</b><br><small>app.lonmaorbit.co.ke</small></div>
</div>
<div class="stats">
<div class="card"><div>Total Orders</div><h2 id="t1">-</h2></div>
<div class="card"><div>Revenue</div><h2 id="t2">-</h2></div>
</div>
<div class="tabs">
<div class="tab active" onclick="show('orders')">Orders</div>
<div class="tab" onclick="show('pay')">M-Pesa Pay</div>
</div>
<div class="section" id="box">Loading...</div>
<script>
async function get(u){let r=await fetch(u);return r.json()}
async function show(t){
let b=document.getElementById('box');
if(t=='orders'){
let d=await get('/orders');
b.innerHTML=`<table><tr><th>ID</th><th>Customer</th><th>Total</th></tr>${d.orders.map(o=>`<tr><td>${o.id}</td><td>${o.customer}</td><td>${o.total}</td></tr>`).join('')}</table>`;
}else{
b.innerHTML=`
<h3>M-Pesa Payment</h3><br>
<input id="p" placeholder="Phone 07...">
<input id="a" placeholder="Amount" type="number">
<input id="o" placeholder="Order ID">
<button onclick="pay()">SEND M-PESA</button>
<div id="r"></div>`;
}
}
async function pay(){
let phone=document.getElementById('p').value;
let amount=document.getElementById('a').value;
let order=document.getElementById('o').value;
let res=await fetch('/pay/mpesa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone,amount:parseInt(amount),order_id:order})});
let data=await res.json();
document.getElementById('r').innerHTML="✅ Sent to "+data.phone+" : KES "+data.amount;
}
(async()=>{
let d=await get('/orders');
document.getElementById('t1').innerText=d.orders.length;
document.getElementById('t2').innerText=d.orders.reduce((x,y)=>x+y.total,0);
show('orders');
})();
</script>
</body>
</html>
