<body>
<style>body{visibility:hidden}</style>
<script>
  const _p = new URLSearchParams(location.search);
const _gu = _p.get('google_user');
if(_gu){
  try{
    const _d = JSON.parse(decodeURIComponent(_gu));
    if(_d.token) localStorage.setItem('token', _d.token);
    if(_d.user) localStorage.setItem('user', JSON.stringify(_d.user));
    else if(_d.email) localStorage.setItem('user', JSON.stringify(_d));
    if(!_d.token && typeof _gu === 'string' && _gu.length > 20) localStorage.setItem('token', _gu);
  }catch(e){ localStorage.setItem('token', _gu); }
  history.replaceState({}, '', '/');
}
async function forceCheck(){
  const token = localStorage.getItem('token');
  if(!token){ window.location.href='/login.html'; return; }
  try{
    const r = await fetch('/api/auth/me',{headers:{'Authorization':'Bearer '+token}});
    if(!r.ok){ localStorage.clear(); window.location.href='/login.html'; return; }
    // Logged in - show page
    document.body.style.visibility='visible';
  }catch(e){ localStorage.clear(); window.location.href='/login.html'; }
}
forceCheck();
function logout(){
  fetch('/api/auth/logout',{method:'POST',headers:{'Authorization':'Bearer '+localStorage.getItem('token')}});
  localStorage.clear();
  window.location.href='/login.html';
}
</script>
