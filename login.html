<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lonma Orbit - Sign In</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
  body{background:#f5f5f5;display:flex;justify-content:center;padding:20px}
  .card{background:#fff;width:100%;max-width:420px;border-radius:16px;padding:28px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
  .logo{text-align:center;font-size:28px;font-weight:900;margin-bottom:5px}
  .logo span{color:#f5a623}
  .sub{text-align:center;color:#777;font-size:13px;margin-bottom:20px}
  .tabs{display:flex;background:#eee;border-radius:10px;padding:4px;margin-bottom:18px}
  .tabs button{flex:1;padding:10px;border:0;border-radius:8px;background:transparent;cursor:pointer;font-weight:700}
  .tabs button.active{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1)}
  input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0;font-size:15px}
  .btn{width:100%;padding:13px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:10px}
  .btn-gold{background:#f5a623}
  .link{display:block;text-align:center;margin-top:12px;font-size:13px;color:#007bff;cursor:pointer;text-decoration:none}
  .msg{text-align:center;font-size:13px;margin-top:10px;min-height:18px}
  .msg.error{color:#d00}
  .msg.ok{color:#0a0}
  .forgot{border-top:1px solid #eee;margin-top:18px;padding-top:15px}
  .forgot h3{font-size:18px;margin-bottom:5px}
  .forgot p{font-size:13px;color:#666;margin-bottom:8px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">LONMA<span> ORBIT</span></div>
  <div class="sub">Sign in to continue</div>

  <!-- TABS -->
  <div class="tabs">
    <button id="tabSignIn" class="active" onclick="showTab('signin')">Sign In</button>
    <button id="tabSignUp" onclick="showTab('signup')">Create Account</button>
  </div>

  <!-- SIGN IN -->
  <div id="signinForm">
    <input id="loginPhone" placeholder="Phone e.g 0712345678">
    <input id="loginPw" type="password" placeholder="Password">
    <button class="btn" onclick="doLogin()">Sign In</button>
    <a class="link" onclick="showForgot()">Forgot Password?</a>
    <p id="loginMsg" class="msg"></p>
  </div>

  <!-- SIGN UP -->
  <div id="signupForm" style="display:none">
    <input id="regName" placeholder="Full Name">
    <input id="regPhone" placeholder="Phone e.g 0712345678">
    <input id="regPw" type="password" placeholder="Password">
    <button class="btn btn-gold" onclick="doSignup()">Create Account</button>
    <p id="regMsg" class="msg"></p>
  </div>

  <!-- FORGOT PASSWORD - PHONE OTP FOR ALL USERS -->
  <div id="forgotBox" class="forgot" style="display:none">
    <h3>Forgot Password</h3>
    <p>Enter the phone you signed up with. We'll send you a code.</p>
    <input id="fpPhone" placeholder="Phone e.g 0712345678">
    <button class="btn" onclick="sendCode()">Send Code</button>
    <input id="fpCode" placeholder="6-digit code" maxlength="6">
    <input id="fpNewPw" type="password" placeholder="New Password">
    <button class="btn btn-gold" onclick="doReset()">Reset Password</button>
    <p id="fpMsg" class="msg"></p>
    <a class="link" onclick="hideForgot()">Back to Sign In</a>
  </div>
</div>

<script>
function showTab(t){
  document.getElementById('signinForm').style.display = t==='signin'?'block':'none';
  document.getElementById('signupForm').style.display = t==='signup'?'block':'none';
  document.getElementById('forgotBox').style.display = 'none';
  document.getElementById('tabSignIn').classList.toggle('active', t==='signin');
  document.getElementById('tabSignUp').classList.toggle('active', t==='signup');
}
function showForgot(){
  document.getElementById('signinForm').style.display='none';
  document.getElementById('signupForm').style.display='none';
  document.getElementById('forgotBox').style.display='block';
  // pre-fill phone from login
  const p = document.getElementById('loginPhone').value;
  if(p) document.getElementById('fpPhone').value = p;
}
function hideForgot(){
  document.getElementById('forgotBox').style.display='none';
  document.getElementById('signinForm').style.display='block';
}

async function doLogin(){
  const phone = document.getElementById('loginPhone').value;
  const password = document.getElementById('loginPw').value;
  const el = document.getElementById('loginMsg');
  el.innerText = "Signing in..."; el.className="msg";
  const r = await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password})});
  const j = await r.json();
  if(j.status==='ok'){
    el.innerText="Success! Redirecting..."; el.className="msg ok";
    localStorage.setItem('token', j.token || '');
    localStorage.setItem('user', JSON.stringify(j.user || {}));
    setTimeout(()=>{ window.location.href='/'; },800);
  } else {
    el.innerText = j.message || "Wrong phone or password"; el.className="msg error";
  }
}

async function doSignup(){
  const name = document.getElementById('regName').value;
  const phone = document.getElementById('regPhone').value;
  const password = document.getElementById('regPw').value;
  const el = document.getElementById('regMsg');
  el.innerText="Creating account..."; el.className="msg";
  const r = await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone,password})});
  const j = await r.json();
  if(j.status==='ok'){
    el.innerText="Account created! Please Sign In"; el.className="msg ok";
    setTimeout(()=>showTab('signin'),1000);
  } else {
    el.innerText = j.message || "Failed"; el.className="msg error";
  }
}

async function sendCode(){
  const phone = document.getElementById('fpPhone').value;
  const el = document.getElementById('fpMsg');
  el.innerText="Sending code..."; el.className="msg";
  const r = await fetch('/api/auth/forgot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})});
  const j = await r.json();
  el.innerText = j.message; el.className = j.status==='ok'?"msg ok":"msg error";
}
async function doReset(){
  const phone = document.getElementById('fpPhone').value;
  const code = document.getElementById('fpCode').value;
  const password = document.getElementById('fpNewPw').value;
  const el = document.getElementById('fpMsg');
  const r = await fetch('/api/auth/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,code,password})});
  const j = await r.json();
  el.innerText = j.message; el.className = j.status==='ok'?"msg ok":"msg error";
  if(j.status==='ok') setTimeout(()=>location.reload(),1500);
}
</script>
</body>
</html>
