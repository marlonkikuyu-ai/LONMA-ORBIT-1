<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LONMA ORBIT - Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0b1220;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#111a2e;width:100%;max-width:420px;padding:28px 24px;border-radius:18px;border:1px solid #1e293b}
.logo{width:90px;height:90px;object-fit:cover;border-radius:50%;display:block;margin:0 auto;border:3px solid #22c55e;background:white}
h1{text-align:center;font-size:22px;letter-spacing:2px;margin-top:12px}
.sub{text-align:center;color:#94a3b8;font-size:13px;margin:6px 0 18px}
.tabs{display:flex;background:#0b1220;border-radius:10px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:0;border-radius:8px;cursor:pointer;background:transparent;color:#94a3b8;font-weight:bold}
.tabs button.active{background:#22c55e;color:white}
label{font-size:13px;color:#cbd5e1;display:block;margin:12px 0 6px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0b1220;color:white;outline:none}
.hint{font-size:11px;color:#94a3b8;margin-top:5px}
.pw-wrap{position:relative;display:flex;align-items:center}
.pw-wrap input{padding-right:50px}
.eye{position:absolute;right:8px;background:#1e293b;border:0;border-radius:8px;color:white;font-size:16px;cursor:pointer;padding:7px 10px;z-index:5}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.row a{color:#4ade80;font-size:12px;cursor:pointer;text-decoration:underline}
.check{font-size:12px;color:#94a3b8;display:flex;align-items:center;gap:6px}
.check input{width:16px}
.btn{width:100%;padding:13px;margin-top:18px;border:0;border-radius:10px;background:#22c55e;color:white;font-weight:bold;font-size:15px;cursor:pointer}
.msg{text-align:center;font-size:13px;margin-top:12px;min-height:18px}
.msg.error{color:#f87171}.msg.success{color:#4ade80}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.open{display:flex}
.modal-box{background:#111a2e;width:100%;max-width:380px;padding:22px;border-radius:16px}
.modal-box h3{margin-bottom:8px}.modal-box p{font-size:12px;color:#94a3b8;margin-bottom:10px}
</style>
</head>
<body>
<div class="card">
<img src="/logo.png" class="logo">
<h1>LONMA ORBIT</h1><p class="sub">Quality Products, Delivered to You</p>
<div class="tabs">
<button id="tabSignin" class="active" onclick="showTab('signin')">Sign In</button>
<button id="tabSignup" onclick="showTab('signup')">Create Account</button>
</div>
<div id="signinBox">
<label>Email</label><input id="loginEmail" type="email" placeholder="Enter your email" autocomplete="email">
<div class="hint">Use the email you registered with.</div>
<label>Password</label>
<div class="pw-wrap"><input id="loginPassword" type="password" placeholder="Enter your password" autocomplete="current-password"><button type="button" class="eye" id="eyeLogin">👁️</button></div>
<div class="row"><label class="check"><input type="checkbox" id="showLoginPw"> Show password</label><a onclick="openForgot()">Forgot Password?</a></div>
<button class="btn" onclick="doLogin()">Sign In</button>
</div>
<div id="signupBox" style="display:none">
<label>Full Name</label><input id="regName" type="text" placeholder="Enter your full name">
<label>Email</label><input id="regEmail" type="email" placeholder="Enter your email" autocomplete="email">
<div class="hint">Security alerts & orders go to this email.</div>
<label>Password</label>
<div class="pw-wrap"><input id="regPassword" type="password" placeholder="Create password" autocomplete="new-password"><button type="button" class="eye" id="eyeReg">👁️</button></div>
<div class="row"><label class="check"><input type="checkbox" id="showRegPw"> Show password</label><span></span></div>
<button class="btn" onclick="doRegister()">Create Account</button>
</div>
<div id="msg" class="msg"></div>
</div>

<div id="forgotModal" class="modal"><div class="modal-box">
<h3>Forgot Password?</h3><p>Enter your email + a new password. We will reset it for you.</p>
<label>Email</label><input id="forgotEmail" type="email" placeholder="Your registered email">
<label>New Password</label>
<div class="pw-wrap"><input id="forgotPassword" type="password" placeholder="New password"><button type="button" class="eye" id="eyeForgot">👁️</button></div>
<label class="check" style="margin-top:8px"><input type="checkbox" id="showForgotPw"> Show password</label>
<button class="btn" onclick="doForgot()">Reset Password</button>
<button class="btn" style="background:#334155;margin-top:8px" onclick="closeForgot()">Cancel</button>
<div id="forgotMsg" class="msg"></div>
</div></div>

<script>
function showTab(t){
  document.getElementById('signinBox').style.display=t==='signin'?'block':'none';
  document.getElementById('signupBox').style.display=t==='signup'?'block':'none';
  document.getElementById('tabSignin').classList.toggle('active',t==='signin');
  document.getElementById('tabSignup').classList.toggle('active',t==='signup');
}
// SHOW PASSWORD - works on all 3 fields
function setupEye(eyeId,inputId,checkId){
  const eye=document.getElementById(eyeId), inp=document.getElementById(inputId), chk=document.getElementById(checkId);
  function toggle(){ inp.type = inp.type==='password'?'text':'password'; eye.textContent = inp.type==='password'?'👁️':'🙈'; if(chk) chk.checked = inp.type==='text'; }
  eye.addEventListener('click',toggle);
  if(chk) chk.addEventListener('change',()=>{ inp.type=chk.checked?'text':'password'; eye.textContent=chk.checked?'🙈':'👁️'; });
}
setupEye('eyeLogin','loginPassword','showLoginPw');
setupEye('eyeReg','regPassword','showRegPw');
setupEye('eyeForgot','forgotPassword','showForgotPw');
function setMsg(t,ok){const m=document.getElementById('msg');m.textContent=t;m.className='msg '+(ok?'success':'error');}
function openForgot(){ document.getElementById('forgotEmail').value=document.getElementById('loginEmail').value; document.getElementById('forgotModal').classList.add('open'); }
function closeForgot(){ document.getElementById('forgotModal').classList.remove('open'); }
async function doForgot(){
  const email=document.getElementById('forgotEmail').value.trim().toLowerCase();
  const np=document.getElementById('forgotPassword').value;
  const m=document.getElementById('forgotMsg');
  if(!email.includes('@')){m.textContent='Enter valid email';m.className='msg error';return;}
  if(np.length<4){m.textContent='New password min 4 chars';m.className='msg error';return;}
  m.textContent='Resetting...';m.className='msg success';
  try{
    const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:np})});
    const d=await r.json();
    if(d.status!=='ok'){m.textContent=d.message||'Failed';m.className='msg error';return;}
    m.textContent='Password reset! Now Sign In with new password';m.className='msg success';
    setTimeout(()=>{closeForgot();showTab('signin');document.getElementById('loginEmail').value=email;},1200);
  }catch(e){m.textContent='Network error';m.className='msg error';}
}
async function doRegister(){
  const name=document.getElementById('regName').value.trim();
  const email=document.getElementById('regEmail').value.trim().toLowerCase();
  const password=document.getElementById('regPassword').value;
  if(!name||!email||!password) return setMsg('Fill all fields',false);
  if(!email.includes('@')) return setMsg('Enter valid email',false);
  setMsg('Creating account...',true);
  try{
    const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,phone:email,password})});
    const d=await r.json();
    if(d.status!=='ok') return setMsg(d.message||'Registration failed',false);
    localStorage.setItem('lonma_user',JSON.stringify(d.user));localStorage.setItem('token','loggedin');
    setMsg('Welcome '+d.user.name,true);setTimeout(()=>window.location.href='/home',600);
  }catch(e){setMsg('Network error',false);}
}
async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim().toLowerCase();
  const password=document.getElementById('loginPassword').value;
  if(!email||!password) return setMsg('Enter email and password',false);
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,phone:email,password})});
    const d=await r.json();
    if(d.status!=='ok') return setMsg(d.message||'Wrong email or password',false);
    localStorage.setItem('lonma_user',JSON.stringify(d.user));localStorage.setItem('token','loggedin');
    window.location.href='/home';
  }catch(e){setMsg('Network error',false);}
}
</script>
</body>
</html>
