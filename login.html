<!DOCTYPE html>
<html><head><title>Lonma Orbit - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:sans-serif;background:#0f172a;color:white;display:flex;justify-content:center;padding:20px}
.box{background:#1e293b;padding:25px;border-radius:12px;width:100%;max-width:380px}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;box-sizing:border-box}
button{width:100%;padding:12px;margin:8px 0;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.login{background:#22c55e;color:white}
#msg{color:#facc15;text-align:center;margin:10px 0}
.tabs{display:flex;gap:10px}
.tabs button{flex:1;background:#334155;color:white}
.tabs button.active{background:#22c55e}
</style></head>
<body>
<div class="box">
<img src="/logo.png" style="width:80px;display:block;margin:0 auto">
<h2 style="text-align:center">LONMA ORBIT</h2>
<div class="tabs">
<button id="tabLogin" class="active" onclick="show('login')">Sign In</button>
<button id="tabSignup" onclick="show('signup')">Create Account</button>
</div>
<div id="msg"></div>
<input id="name" placeholder="Full name" style="display:none">
<input id="identifier" placeholder="Phone 07xxx OR Email" type="text">
<input id="password" placeholder="Password (min 4 chars)" type="password">
<button class="login" id="mainBtn" onclick="submitAuth()">Sign In</button>
<p style="font-size:12px;text-align:center;opacity:.7">Use phone or email. By creating an account you agree to Terms & Conditions.</p>
</div>
<script>
let mode='login';
function show(m){mode=m;
 document.getElementById('tabLogin').className=m=='login'?'active':'';
 document.getElementById('tabSignup').className=m=='signup'?'active':'';
 document.getElementById('name').style.display=m=='signup'?'block':'none';
 document.getElementById('mainBtn').innerText=m=='login'?'Sign In':'Create Account';
}
async function submitAuth(){
 const identifier=document.getElementById('identifier').value.trim();
 const password=document.getElementById('password').value;
 const name=document.getElementById('name').value.trim();
 if(!identifier||!password){document.getElementById('msg').innerText='Enter phone/email + password';return;}
 if(mode=='signup'&&!name){document.getElementById('msg').innerText='Enter full name';return;}
 // Auto-detect: contains @ = email, else phone
 const isEmail = identifier.includes('@');
 const url=mode=='login'?'/api/auth/login':'/api/auth/signup';
 const body=mode=='login'
   ? (isEmail ? {email:identifier,password} : {phone:identifier,password})
   : (isEmail ? {email:identifier,password,name} : {phone:identifier,password,name});
 document.getElementById('msg').innerText='Please wait...';
 try{
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok){document.getElementById('msg').innerText=d.detail||'Failed';return;}
  localStorage.setItem('token',d.token);
  localStorage.setItem('name',d.name||name||'');
  if(d.phone) localStorage.setItem('phone',d.phone);
  if(d.email) localStorage.setItem('email',d.email);
  document.getElementById('msg').innerText='Welcome '+(d.name||name);
  setTimeout(()=>location.href='/',800);
 }catch(e){document.getElementById('msg').innerText='Network error';}
}
</script></body></html>
