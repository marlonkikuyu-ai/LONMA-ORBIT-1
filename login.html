<!DOCTYPE html>
<html><head><title>Lonma Orbit - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:sans-serif;background:#0f172a;color:white;display:flex;justify-content:center;padding:20px}
.box{background:#1e293b;padding:25px;border-radius:12px;width:100%;max-width:380px}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;box-sizing:border-box}
button{width:100%;padding:12px;margin:8px 0;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.login{background:#22c55e;color:white}
.signup{background:white;color:#0f172a}
#msg{color:#facc15;text-align:center;margin:10px 0}
.tabs{display:flex;gap:10px}
.tabs button{flex:1;background:#334155;color:white}
.tabs button.active{background:#22c55e}
</style></head>
<body>
<div class="box">
<img src="/logo.png" style="width:80px;display:block;margin:0 auto">
<h2 style="text-align:center">Lonma Orbit</h2>
<div class="tabs">
<button id="tabLogin" class="active" onclick="show('login')">Log In</button>
<button id="tabSignup" onclick="show('signup')">Sign Up</button>
</div>
<div id="msg"></div>
<input id="name" placeholder="Full Name (Sign Up only)" style="display:none">
<input id="email" placeholder="Your Email" type="email">
<input id="password" placeholder="Your Password (8+ chars)" type="password">
<button class="login" id="mainBtn" onclick="submitAuth()">Log In</button>
<button onclick="location.href='/'">Back to Home</button>
</div>
<script>
let mode='login';
function show(m){mode=m;
 document.getElementById('tabLogin').className=m=='login'?'active':'';
 document.getElementById('tabSignup').className=m=='signup'?'active':'';
 document.getElementById('name').style.display=m=='signup'?'block':'none';
 document.getElementById('mainBtn').innerText=m=='login'?'Log In':'Create My Account';
}
async function submitAuth(){
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const name=document.getElementById('name').value.trim();
 const url=mode=='login'?'/api/auth/login':'/api/auth/signup';
 const body=mode=='login'?{email,password}:{email,password,name};
 document.getElementById('msg').innerText='Please wait...';
 const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const d=await r.json();
 if(!r.ok){document.getElementById('msg').innerText=d.detail||'Failed';return;}
 if(mode=='signup'){document.getElementById('msg').innerText='Account created! Now Log In.';show('login');return;}
 localStorage.setItem('token',d.token);
 localStorage.setItem('email',d.email);
 localStorage.setItem('role',d.role);
 document.getElementById('msg').innerText='Welcome '+d.name;
 setTimeout(()=>location.href='/',800);
}
</script></body></html>
